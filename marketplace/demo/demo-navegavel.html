<title>Secure Privacy Market</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #06080b; --bg-2: #0a0d12; --bg-3: #10141b; --bg-4: #161b24;
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
  --text: #e9edf2; --text-2: #a3acb9; --text-3: #6b7482;
  --signal: #4be3c1; --signal-dim: rgba(75,227,193,.14);
  --threat: #ff5d5d; --warn: #ffc560;
  --radius: 12px; --wrap: 1280px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Inter Tight", "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.7,.1,1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15.5px/1.6 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -.02em; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0 0 1em; }
::selection { background: var(--signal); color: var(--bg); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: .82em; letter-spacing: .02em; }
.muted { color: var(--text-3); }
.dim { color: var(--text-2); }
.wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; font: 500 14.5px var(--font); cursor: pointer; white-space: nowrap; transition: all .2s var(--ease); background: none; color: var(--text); }
.btn--primary { background: var(--signal); color: #04110d; }
.btn--primary:hover { box-shadow: 0 0 0 5px var(--signal-dim); }
.btn--ghost { border-color: var(--line-2); background: rgba(255,255,255,.02); }
.btn--ghost:hover { border-color: var(--signal); color: var(--signal); }
.btn--danger { border-color: rgba(255,93,93,.4); color: var(--threat); }
.btn--sm { min-height: 34px; padding: 0 14px; font-size: 13px; }
.btn--block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { color: var(--signal); }
.link:hover { text-decoration: underline; }

/* Topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(6,8,11,.85); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--line); }
.top__bar { display: flex; align-items: center; gap: 24px; height: 68px; }
.brand { display: inline-flex; align-items: center; gap: 10px; flex: none; }
.brand svg { width: 28px; height: 28px; }
.brand span { font-family: var(--display); letter-spacing: .2em; font-size: 13px; }
.brand b { font-weight: 700; }
.brand em { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--signal); border: 1px solid rgba(75,227,193,.35); padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
.search { flex: 1; display: flex; max-width: 560px; position: relative; }
.search input { width: 100%; height: 42px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); padding: 0 46px 0 18px; font: 14.5px var(--font); }
.search input:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 4px var(--signal-dim); }
.search button { position: absolute; right: 4px; top: 4px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--signal); color: #04110d; cursor: pointer; display: grid; place-items: center; }
.top__nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.top__nav > a, .top__nav > form > button { font-size: 14px; color: var(--text-2); padding: 8px 12px; border-radius: 8px; background: none; border: 0; cursor: pointer; font-family: var(--font); display: inline-flex; align-items: center; gap: 6px; }
.top__nav > a:hover, .top__nav > form > button:hover { color: var(--text); background: var(--bg-3); }
.badge-count { background: var(--signal); color: #04110d; font-size: 11px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0 5px; }
.cats { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; height: 44px; align-items: center; }
.cats::-webkit-scrollbar { display: none; }
.cats a { font-size: 13.5px; color: var(--text-2); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.cats a:hover, .cats a.on { color: var(--text); background: var(--bg-3); }

/* Seções */
.section { padding-block: 56px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.head h2 { font-size: clamp(22px, 2.4vw, 30px); }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--signal); margin-bottom: 10px; display: block; }
.page-title { font-size: clamp(26px, 3.2vw, 40px); margin-bottom: 8px; }

/* Hero */
.hero { padding-block: 64px 40px; position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse 70% 80% at 70% 30%, #000 20%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 70% 80% at 70% 30%, #000 20%, transparent 75%); opacity: .6; pointer-events: none; }
.hero__in { position: relative; display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: center; }
.hero h1 { font-size: clamp(34px, 4.6vw, 60px); line-height: 1.04; letter-spacing: -.035em; margin-bottom: 18px; }
.hero h1 span { color: var(--text-3); }
.hero p { color: var(--text-2); font-size: 17.5px; max-width: 540px; }
.hero__search { display: flex; gap: 8px; margin-top: 26px; max-width: 560px; }
.hero__search input { flex: 1; min-width: 0; height: 52px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); padding: 0 22px; font: 16px var(--font); }
.hero__search input:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 4px var(--signal-dim); }
.hero__search .btn { min-height: 52px; }
.hero__tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.hero__tags a { font-size: 13px; color: var(--text-2); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; }
.hero__tags a:hover { border-color: var(--signal); color: var(--signal); }
.trustbox { background: rgba(10,13,18,.85); border: 1px solid var(--line-2); border-radius: 16px; padding: 24px; display: grid; gap: 16px; }
.trustbox div { display: grid; grid-template-columns: 36px 1fr; gap: 14px; align-items: start; }
.trustbox svg { width: 36px; height: 36px; padding: 8px; border-radius: 10px; background: var(--signal-dim); color: var(--signal); }
.trustbox b { display: block; font-weight: 600; font-size: 15px; }
.trustbox span { font-size: 13.5px; color: var(--text-2); }

/* Tipos */
.types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.type { position: relative; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; background: var(--bg-2); transition: all .25s var(--ease); display: flex; flex-direction: column; gap: 8px; min-height: 170px; overflow: hidden; }
.type:hover { border-color: rgba(75,227,193,.5); transform: translateY(-2px); }
.type svg { width: 28px; height: 28px; color: var(--signal); margin-bottom: auto; }
.type h3 { font-size: 19px; margin-top: 24px; }
.type p { color: var(--text-2); font-size: 13.5px; margin: 0; }
.type .n { position: absolute; right: 18px; top: 18px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }

/* Grade de anúncios */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.pcard { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s, transform .2s var(--ease); }
.pcard:hover { border-color: var(--line-2); transform: translateY(-2px); }
.pcard__body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.pcard__type { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.pcard h3 { font-family: var(--font); font-size: 15px; font-weight: 500; letter-spacing: 0; line-height: 1.4; }
.pcard__store { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.pcard__price { margin-top: auto; padding-top: 10px; font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
.pcard__price small { font-weight: 400; color: var(--text-3); font-size: 12.5px; }
.stars { color: var(--warn); font-size: 12.5px; letter-spacing: 1px; }
.stars span { color: var(--text-3); letter-spacing: 0; margin-left: 4px; }

/* Visual do anúncio */
.visual { position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; background: radial-gradient(circle at 70% 25%, rgba(75,227,193,.13), transparent 55%), linear-gradient(160deg, var(--bg-4), var(--bg-2)); border-bottom: 1px solid var(--line); overflow: hidden; }
.visual::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; opacity: .6; mask-image: radial-gradient(circle at 50% 50%, #000, transparent 75%); -webkit-mask-image: radial-gradient(circle at 50% 50%, #000, transparent 75%); }
.visual svg { position: relative; width: 30%; height: auto; color: var(--signal); filter: drop-shadow(0 0 18px rgba(75,227,193,.35)); }
.visual .tag { position: absolute; left: 12px; top: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; background: rgba(6,8,11,.75); border: 1px solid var(--line-2); color: var(--text-2); }
.visual--lg { border: 1px solid var(--line); border-radius: 16px; }
.visual--lg svg { width: 22%; }

/* Selos */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-2); white-space: nowrap; }
.pill--ok { color: var(--signal); border-color: rgba(75,227,193,.4); background: var(--signal-dim); }
.pill--warn { color: var(--warn); border-color: rgba(255,197,96,.4); background: rgba(255,197,96,.08); }
.pill--bad { color: var(--threat); border-color: rgba(255,93,93,.4); background: rgba(255,93,93,.08); }
.verified { display: inline-flex; color: var(--signal); }
.verified svg { width: 14px; height: 14px; }

/* Catálogo */
.catalog { display: grid; grid-template-columns: 250px 1fr; gap: 32px; align-items: start; }
.filters { position: sticky; top: 132px; display: flex; flex-direction: column; gap: 22px; }
.filters h4 { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); margin: 0 0 10px; font-weight: 400; }
.filters a, .filters button { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 8px; font-size: 14px; color: var(--text-2); }
.filters a:hover, .filters button:hover { background: var(--bg-3); color: var(--text); }
.filters a.on, .filters button.on { background: var(--signal-dim); color: var(--signal); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.sort { display: flex; gap: 6px; flex-wrap: wrap; }
.sort a, .sort button { font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--text-2); }
.sort a.on, .sort button.on { border-color: var(--signal); color: var(--signal); }
.empty { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 48px 24px; text-align: center; color: var(--text-2); }
.empty h3 { color: var(--text); margin-bottom: 8px; font-size: 20px; }

/* Produto */
.product { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: start; }
.crumbs { font-size: 13px; color: var(--text-3); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.crumbs a:hover { color: var(--text); }
.buybox { border: 1px solid var(--line-2); border-radius: 16px; padding: 24px; background: var(--bg-2); display: flex; flex-direction: column; gap: 16px; position: sticky; top: 132px; }
.buybox .big { font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.buybox .big small { font-size: 15px; color: var(--text-3); font-weight: 400; }
.specs { width: 100%; border-collapse: collapse; font-size: 14px; }
.specs th, .specs td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.specs th { color: var(--text-3); font-weight: 400; width: 42%; }
.sellerbox { display: flex; gap: 14px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); }
.avatar { width: 46px; height: 46px; border-radius: 12px; background: var(--bg-4); border: 1px solid var(--line-2); display: grid; place-items: center; font-family: var(--display); font-weight: 600; color: var(--signal); flex: none; }
.avatar--lg { width: 72px; height: 72px; border-radius: 18px; font-size: 26px; }
.review { padding: 16px 0; border-bottom: 1px solid var(--line); }
.prose { color: var(--text-2); white-space: pre-line; }

/* Formulários */
.card { border: 1px solid var(--line); border-radius: 16px; background: var(--bg-2); padding: 24px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--text-2); }
.field > small { font-size: 12px; color: var(--text-3); }
.input, .field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; color: var(--text); font: 15px var(--font); padding: 11px 13px; }
.field textarea { resize: vertical; min-height: 110px; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 4px var(--signal-dim); }
.qty { width: 80px !important; text-align: center; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }
.choice label { cursor: pointer; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice span { display: inline-block; padding: 9px 15px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 14px; color: var(--text-2); }
.choice input:checked + span { border-color: var(--signal); color: var(--signal); background: var(--signal-dim); }
.choice input:focus-visible + span { outline: 2px solid var(--signal); outline-offset: 2px; }
.alert { padding: 12px 16px; border-radius: 10px; font-size: 14px; border: 1px solid; }
.alert--bad { color: var(--threat); border-color: rgba(255,93,93,.35); background: rgba(255,93,93,.07); }
.alert--ok { color: var(--signal); border-color: rgba(75,227,193,.35); background: var(--signal-dim); }
.alert--info { color: var(--text-2); border-color: var(--line-2); background: var(--bg-3); }
.auth { max-width: 440px; margin: 56px auto; }

/* Tabelas */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
.table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
.table th { text-align: left; font-weight: 400; color: var(--text-3); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.table td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Painel */
.dash { display: grid; grid-template-columns: 230px 1fr; gap: 32px; padding-top: 32px; padding-bottom: 64px; align-items: start; }
.side { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 2px; }
.side a { padding: 9px 12px; border-radius: 8px; font-size: 14px; color: var(--text-2); }
.side a:hover { background: var(--bg-3); color: var(--text); }
.side a.on { background: var(--signal-dim); color: var(--signal); }
.side h4 { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--text-3); text-transform: uppercase; margin: 0 0 10px 12px; font-weight: 400; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
.kpi { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; background: var(--bg-2); }
.kpi span { font-size: 12.5px; color: var(--text-3); display: block; }
.kpi b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

/* Carrinho */
.cart { display: grid; grid-template-columns: 1fr 360px; gap: 32px; align-items: start; }
.line { display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: center; }
.line .visual { border-radius: 10px; border: 1px solid var(--line); }
.summary { position: sticky; top: 132px; }
.summary dl { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 0 0 16px; font-size: 14.5px; }
.summary dt { color: var(--text-2); }
.summary dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.summary .total { font-size: 20px; font-weight: 600; color: var(--text); padding-top: 12px; border-top: 1px solid var(--line); }

/* CTA vendedor */
.sellcta { border: 1px solid var(--line-2); border-radius: 20px; padding: clamp(28px, 4vw, 48px); display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; align-items: center; background: radial-gradient(ellipse at 90% 10%, rgba(75,227,193,.10), transparent 60%), var(--bg-2); }
.sellcta h2 { font-size: clamp(24px, 3vw, 38px); margin-bottom: 12px; }
.sellcta ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; color: var(--text-2); font-size: 14.5px; }
.sellcta li::before { content: "→ "; color: var(--signal); }

/* Rodapé */
.foot { border-top: 1px solid var(--line); padding: 40px 0 32px; margin-top: 40px; font-size: 13.5px; color: var(--text-3); }
.foot__in { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 24px; }
.foot h5 { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); margin: 0 0 12px; font-weight: 400; }
.foot a { display: block; padding: 3px 0; }
.foot a:hover { color: var(--signal); }
.foot__legal { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }
.demo { background: rgba(255,197,96,.08); border-bottom: 1px solid rgba(255,197,96,.25); color: var(--warn); font-size: 12.5px; text-align: center; padding: 6px 16px; }

@media (max-width: 1000px) {
  .hero__in, .product, .cart, .sellcta { grid-template-columns: 1fr; }
  .types { grid-template-columns: 1fr 1fr; }
  .catalog { grid-template-columns: 1fr; }
  .filters { position: static; flex-direction: row; overflow-x: auto; gap: 8px; }
  .filters > div { flex: none; }
  .filters h4 { display: none; }
  .filters nav { display: flex; gap: 6px; }
  .filters a, .filters button { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; }
  .buybox, .summary { position: static; }
  .dash { grid-template-columns: 1fr; gap: 16px; }
  .side { position: static; flex-direction: row; overflow-x: auto; }
  .side h4 { display: none; }
  .side a { white-space: nowrap; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .foot__in { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  .top__bar { flex-wrap: wrap; height: auto; padding: 12px 0; gap: 12px; }
  .search { order: 3; max-width: none; flex-basis: 100%; }
  .top__nav { gap: 0; }
  .top__nav .hide-sm { display: none; }
  .form-row { grid-template-columns: 1fr; }
  .types { grid-template-columns: 1fr; }
  .type { min-height: 0; }
  .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .pcard__body { padding: 12px; }
  .pcard h3 { font-size: 14px; }
  .hero__search { flex-direction: column; }
  .line { grid-template-columns: 72px 1fr; }
  .line > :last-child { grid-column: 2; }
  .foot__in { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.buybox .pill { align-self: flex-start; }
.trustbox p { margin: 0; line-height: 1.45; }
.trustbox span { display: block; margin-top: 3px; }
@media (max-width: 720px) {

const live = l => l.status === "ACTIVE" && storeOf(l)?.status === "APPROVED";
const avg = l => l.reviews.length ? l.reviews.reduce((s, r) => s + r.r, 0) / l.reviews.length : 0;

/* ---------------- Componentes ---------------- */
const stars = l => l.reviews.length ? `<span class="stars">${"★".repeat(Math.round(avg(l)))}${"☆".repeat(5 - Math.round(avg(l)))}<span>${avg(l).toFixed(1)} (${l.reviews.length})</span></span>` : "";
const visual = (l, lg) => `<div class="visual${lg ? " visual--lg" : ""}"><span class="tag">${esc(TYPES[l.type].singular.toUpperCase())}</span>${icon(catOf(l).icon, 64)}</div>`;
const verified = s => s.verified ? `<span class="verified" title="Vendedor verificado">${icon("shield", 14)}</span>` : "";
const card = l => { const s = storeOf(l); return `<a href="#produto-${l.slug}" class="pcard">${visual(l)}<div class="pcard__body"><span class="pcard__type">${esc(catOf(l).name)}</span><h3>${esc(l.title)}</h3><span class="pcard__store">${esc(s.name)} ${verified(s)}</span>${stars(l)}<span class="pcard__price">${price(l)}</span></div></a>`; };
const grid = ls => `<div class="grid">${ls.map(card).join("")}</div>`;
const flashBox = () => { if (!flash) return ""; const f = flash; flash = null; return `<p class="alert alert--${f[0]}" role="status">${esc(f[1])}</p>`; };
const go = (h, f) => { if (f) flash = f; if (location.hash === "#" + h) render(); else location.hash = h; };

function layers(compact) {
  const cur = LEVELS.find(l => l.id === layerLevel);
  return `<div class="layers"><div class="levels" role="tablist" aria-label="Nível de segurança">${LEVELS.map(l => `<button type="button" role="tab" aria-selected="${l.id === layerLevel}" class="level${l.id === layerLevel ? " on" : ""}" data-level="${l.id}"><span class="level__bars" aria-hidden="true">${[0,1,2].map(i => `<i class="${i <= RANK[l.id] ? "f" : ""}"></i>`).join("")}</span><b>${l.name}</b><small>${l.who}</small></button>`).join("")}</div>
  <p class="levels__text">${esc(cur.text)}</p>
  <ol class="stackl">${LAYERS.map(L => { const any = L.tech.some(t => RANK[t[2]] <= RANK[layerLevel]); return `<li class="stackl__row${any ? "" : " off"}"><div class="stackl__head"><span class="mono">${L.n}</span><h3>${L.name}</h3>${compact ? "" : `<p>${esc(L.idea)}</p>`}</div><ul class="stackl__tech">${L.tech.map(t => `<li class="${RANK[t[2]] <= RANK[layerLevel] ? "on" : ""}"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></li>`).join("")}</ul>${compact ? "" : `<a class="link stackl__more" href="#explorar" data-search="${L.q}">Ver opções →</a>`}</li>`; }).join("")}</ol></div>`;
}

function header() {
  const u = me(), st = myStore(), n = S.cart.reduce((s, l) => s + l.q, 0), h = location.hash.slice(1);
  return `<header class="top"><div class="wrap"><div class="top__bar">
    <a href="#inicio" class="brand" aria-label="Início">${LOGO}<span>SECURE<b>PRIVACY</b></span><em>MARKET</em></a>
    <form class="search" role="search" data-form="search"><label for="q-top" class="sr">Buscar</label><input id="q-top" name="q" placeholder="Buscar" value="${esc(filt.q)}"><button type="submit" aria-label="Buscar">${icon("search", 16)}</button></form>
    <nav class="top__nav" aria-label="Conta">
      ${st ? `<a href="#painel" class="hide-sm">${icon("store", 16)}Painel</a>` : ""}
      ${u?.role === "ADMIN" ? `<a href="#admin" class="hide-sm">Admin</a>` : ""}
      <a href="${st ? "#novo-anuncio" : "#vender"}" class="nav-sell">Anunciar</a>
      ${u ? `<a href="#conta">${icon("user", 16)}<span class="hide-sm">${esc(u.name.split(" ")[0])}</span></a><button type="button" class="hide-sm linkbtn" data-act="logout">Sair</button>` : `<a href="#entrar">Entrar</a>`}
      <a href="#carrinho" aria-label="Carrinho, ${n} itens">${icon("cart", 18)}${n ? `<span class="badge-count">${n}</span>` : ""}</a>
    </nav></div>
    <nav class="cats" aria-label="Seções"><a href="#camadas" class="${h === "camadas" ? "on" : ""}">Proteção em camadas</a><a href="#explorar" data-type="">Tudo</a>${TK.map(t => `<a href="#explorar" data-type="${t}">${TYPES[t].label}</a>`).join("")}<a href="#politica">Curadoria e itens proibidos</a></nav>
  </div></header>`;
}
const footer = () => `<footer class="foot"><div class="wrap"><div class="foot__in">
  <div><a href="#inicio" class="brand">${LOGO}<span>SECURE<b>PRIVACY</b></span></a><p style="margin-top:14px">Proteção em camadas.</p></div>
  <div><h5>Comprar</h5>${TK.map(t => `<a href="#explorar" data-type="${t}">${TYPES[t].label}</a>`).join("")}</div>
  <div><h5>Vender</h5><a href="#vender">Cadastrar minha loja</a><a href="#painel">Painel do vendedor</a><a href="#politica">Regras de curadoria</a></div>
  <div><h5>Demonstração</h5><a href="#entrar">Trocar de conta</a><button type="button" class="linkbtn" data-act="reset">Reiniciar dados de exemplo</button></div>
  </div><p class="foot__legal mono">Demonstração · dados só neste navegador</p></div></footer>`;

/* ---------------- Páginas ---------------- */
const V = {};

V.inicio = () => {
  const L = S.listings.filter(live), n = t => L.filter(l => l.type === t).length;
  return `<section class="hero"><div class="wrap hero__in"><div>
    <h1>Proteção em camadas. <span>No nível que você precisa.</span></h1>
    <p>Equipamentos, software, serviços e especialistas verificados.</p>
    <form class="hero__search" role="search" data-form="search"><label for="q-hero" class="sr">O que você precisa proteger?</label><input id="q-hero" name="q" placeholder="O que você precisa proteger?"><button class="btn btn--primary" type="submit">Buscar ${icon("arrow", 16)}</button></form>
    <div class="row" style="margin-top:18px"><a href="#vender" class="btn btn--ghost">${icon("store", 16)} Anunciar produto ou serviço</a></div>
    <div class="hero__tags">${["pentest","câmera","FIDO2","LGPD","pânico","proteção executiva"].map(t => `<a href="#explorar" data-search="${t}">${t}</a>`).join("")}</div>
  </div><div class="trustbox">
    <div>${icon("shield")}<p><b>Vendedores verificados</b><span>Documento e credencial conferidos.</span></p></div>
    <div>${icon("eye")}<p><b>Anúncios revisados</b><span>Item proibido não entra.</span></p></div>
    <div>${icon("lock")}<p><b>Pagamento protegido</b><span>Vendedor recebe após a entrega.</span></p></div>
  </div></div></section>
  <section class="section"><div class="wrap"><div class="head"><div><h2>Escolha o nível</h2></div><a href="#camadas" class="link">Ver detalhes →</a></div>${layers(true)}</div></section>
  <section class="section" style="padding-top:0"><div class="wrap"><div class="head"><h2>Categorias</h2></div><div class="types">${TK.map(t => `<a href="#explorar" data-type="${t}" class="type"><span class="n">${n(t)} ofertas</span>${icon(TYPE_ICON[t])}<h3>${TYPES[t].label}</h3><p>${TYPES[t].desc}</p></a>`).join("")}</div></div></section>
  <section class="section" style="padding-top:0"><div class="wrap"><div class="head"><div><h2>Destaques</h2></div><a href="#explorar" class="link" data-type="">Ver tudo →</a></div>${grid(L.filter(l => l.featured).slice(0, 8))}</div></section>
  <section class="section" style="padding-top:0"><div class="wrap"><div class="sellcta"><div><h2>Venda aqui.</h2><p class="dim">Empresa ou profissional. Cadastro em 3 etapas.</p><a href="#vender" class="btn btn--primary">Cadastrar loja ${icon("arrow", 16)}</a></div><ul><li>Selo de verificado</li><li>Pagamento dividido automático</li><li>Orçamentos no painel</li><li>Vendas e estoque em um lugar</li></ul></div></div></section>`;
};

V.camadas = () => `<section class="hero"><div class="wrap" style="max-width:900px"><span class="eyebrow">Proteção em camadas</span><h1>5 camadas. <span>3 níveis.</span></h1><p>Uma camada cobre a falha da outra. Escolha o nível e veja o que entra.</p></div></section>
  <section class="section"><div class="wrap">${layers(false)}</div></section>
  <section class="section" style="padding-top:0"><div class="wrap" style="max-width:900px"><h2 style="font-size:clamp(24px,2.8vw,32px);margin-bottom:20px">Princípios</h2><ol class="stackl">${[
    ["Camadas independentes","Uma falha não derruba tudo."],
    ["Ameaça antes de produto","Defina o risco, depois o controle."],
    ["Proporção","Proteção que atrapalha é abandonada."],
    ["Padrão aberto","Criptografia auditada. Nada de caixa-preta."],
    ["Assuma a invasão","Detectar e conter importa tanto quanto prevenir."]
  ].map(([t, d], i) => `<li class="stackl__row principle"><span class="mono" style="color:var(--signal)">0${i + 1}</span><div><h3 style="font-size:18px;margin-bottom:4px">${t}</h3><p class="dim" style="margin:0">${d}</p></div></li>`).join("")}</ol>
  <div class="row" style="margin-top:28px"><a class="btn btn--primary" href="#explorar" data-type="">Ver produtos</a><a class="btn btn--ghost" href="#explorar" data-type="PROFESSIONAL">Falar com especialista</a></div></div></section>`;

V.explorar = () => {
  const q = filt.q.trim().toLowerCase();
  let ls = S.listings.filter(live).filter(l => (!filt.type || l.type === filt.type) && (!filt.cat || l.cat === filt.cat) &&
    (!q || [l.title, l.summary, catOf(l).name, storeOf(l).name, l.specs.flat().join(" ")].join(" ").toLowerCase().includes(q)));
  if (filt.sort === "destaques") ls = ls.filter(l => l.featured);
  if (filt.sort === "menor") ls.sort((a, b) => (a.price ?? 1e12) - (b.price ?? 1e12));
  if (filt.sort === "maior") ls.sort((a, b) => (b.price ?? -1) - (a.price ?? -1));
  const cats = CATS.filter(c => !filt.type || c.type === filt.type);
  return `<div class="wrap section"><span class="eyebrow">${filt.type ? TYPES[filt.type].label : "Catálogo"}</span><h1 class="page-title">${q ? `Resultados para “${esc(filt.q)}”` : filt.type ? TYPES[filt.type].desc : "Explorar o marketplace"}</h1><p class="dim" style="margin-bottom:28px">${ls.length} ${ls.length === 1 ? "oferta encontrada" : "ofertas encontradas"}${q ? ` · <button type="button" class="linkbtn link" data-act="clear-q">limpar busca</button>` : ""}</p>
  <div class="catalog"><aside class="filters" aria-label="Filtros"><div><h4>Tipo</h4><nav><button type="button" data-ftype="" class="${!filt.type ? "on" : ""}">Tudo</button>${TK.map(t => `<button type="button" data-ftype="${t}" class="${filt.type === t ? "on" : ""}">${TYPES[t].label}</button>`).join("")}</nav></div>
  <div><h4>Categoria</h4><nav>${cats.map(c => `<button type="button" data-fcat="${c.id}" class="${filt.cat === c.id ? "on" : ""}">${c.name}<span class="muted">${S.listings.filter(l => live(l) && l.cat === c.id).length}</span></button>`).join("")}</nav></div></aside>
  <div><div class="toolbar"><div class="sort">${[["recentes","Mais recentes"],["destaques","Destaques"],["menor","Menor preço"],["maior","Maior preço"]].map(([k, t]) => `<button type="button" data-sort="${k}" class="${filt.sort === k ? "on" : ""}">${t}</button>`).join("")}</div></div>
  ${ls.length ? grid(ls) : `<div class="empty"><h3>Nada encontrado</h3><p>Tente outro termo ou remova filtros.</p><button type="button" class="btn btn--ghost" data-act="clear-all">Limpar filtros</button></div>`}</div></div></div>`;
};

V.produto = slug => {
  const l = S.listings.find(x => x.slug === slug), st = myStore(), u = me();
  if (!l || (!live(l) && !(st && st.id === l.store) && u?.role !== "ADMIN")) return V.naoencontrado();
  const s = storeOf(l), quote = l.quote || l.price == null, phys = l.type === "PHYSICAL";
  const bought = u && S.orders.some(o => o.buyer === u.id && o.status !== "PENDING_PAYMENT" && o.items.some(i => i.listing === l.id));
  const related = S.listings.filter(x => live(x) && x.cat === l.cat && x.id !== l.id).slice(0, 4);
  return `<div class="wrap section"><nav class="crumbs"><a href="#explorar" data-type="">Explorar</a>/<a href="#explorar" data-type="${l.type}">${TYPES[l.type].label}</a>/<a href="#explorar" data-cat="${l.cat}">${esc(catOf(l).name)}</a></nav>
  ${l.status !== "ACTIVE" ? `<p class="alert alert--info" style="margin-bottom:20px">Pré-visualização: este anúncio ainda não está público (${LIST_ST[l.status][0].toLowerCase()}).</p>` : ""}
  <div class="product"><div class="stack" style="gap:28px">${visual(l, true)}
    <div><h2 class="h-sm">Descrição</h2><p class="prose">${esc(l.desc)}</p></div>
    ${l.specs.length ? `<div><h2 class="h-sm">Especificações</h2><table class="specs"><tbody>${l.specs.map(([k, v]) => `<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div><h2 class="h-sm">Avaliações</h2>${l.reviews.length ? stars(l) : `<p class="muted">Ainda sem avaliações.</p>`}${l.reviews.map(r => `<div class="review"><div class="row between"><b>${esc(r.name)}</b><span class="stars">${"★".repeat(r.r)}${"☆".repeat(5 - r.r)}</span></div><p class="dim" style="margin:6px 0 0">${esc(r.c)}</p></div>`).join("")}
    ${bought && !l.reviews.some(r => r.uid === u.id) ? `<form class="form card" style="margin-top:18px" data-form="review" data-id="${l.id}"><b>Avaliar sua compra</b><div class="choice">${[5,4,3,2,1].map(n => `<label><input type="radio" name="r" value="${n}" ${n === 5 ? "checked" : ""}><span>${"★".repeat(n)}</span></label>`).join("")}</div><label class="field"><span>Comentário</span><textarea id="rv-c" name="c" rows="3" required></textarea></label><button class="btn btn--ghost" type="submit">Publicar avaliação</button></form>` : ""}</div>
  </div><div class="stack"><span class="eyebrow">${esc(catOf(l).name)}</span><h1 class="page-title" style="font-size:clamp(26px,3vw,36px)">${esc(l.title)}</h1><p class="dim" style="font-size:17px">${esc(l.summary)}</p>${flashBox()}
    <div class="buybox">${quote ? `<div class="big">${price(l)}</div><p class="dim" style="margin:0">Descreva o que precisa. O vendedor envia a proposta.</p>
      ${u ? `<form class="form" data-form="quote" data-id="${l.id}"><label class="field"><span>Empresa (opcional)</span><input id="qt-co" name="co"></label><label class="field"><span>O que você precisa?</span><textarea id="qt-msg" name="msg" rows="4" placeholder="Escopo, prazo, local" required></textarea></label><button class="btn btn--primary btn--block" type="submit">Solicitar orçamento</button></form>` : `<a class="btn btn--primary btn--block" href="#entrar">Entrar para solicitar orçamento</a>`}`
    : `<div class="big">${money(l.price)}${l.unit !== "un" ? `<small> / ${l.unit}</small>` : ""}</div>${phys ? `<span class="pill ${l.stock ? "pill--ok" : "pill--bad"}">${l.stock ? l.stock + " em estoque" : "Sem estoque"}</span>` : ""}
      <form class="row" data-form="add" data-id="${l.id}"><label class="sr" for="qty">Quantidade</label><input id="qty" class="input qty" type="number" name="q" min="1" max="${phys ? Math.max(1, l.stock || 1) : 99}" value="1"><button class="btn btn--primary" style="flex:1" type="submit" ${phys && !l.stock ? "disabled" : ""}>${icon("cart", 16)} Adicionar ao carrinho</button></form>`}
      <p class="mono muted" style="margin:0">Pagamento protegido</p></div>
    <a href="#loja-${s.slug}" class="sellerbox"><span class="avatar">${esc(s.name[0])}</span><span style="flex:1"><b>${esc(s.name)}</b> ${verified(s)}<br><small class="muted">${s.kind === "PROFISSIONAL" ? "Profissional independente" : "Empresa"} · ${esc(s.city)}</small></span>${icon("arrow", 16)}</a>
  </div></div>${related.length ? `<div style="margin-top:64px"><div class="head"><h2>Na mesma categoria</h2></div>${grid(related)}</div>` : ""}</div>`;
};

V.loja = slug => {
  const s = S.stores.find(x => x.slug === slug);
  if (!s || s.status !== "APPROVED") return V.naoencontrado();
  const ls = S.listings.filter(l => l.store === s.id && l.status === "ACTIVE");
  return `<div class="wrap section"><div class="row" style="gap:20px;align-items:flex-start;margin-bottom:40px"><span class="avatar avatar--lg">${esc(s.name[0])}</span><div style="flex:1;min-width:240px"><span class="eyebrow">${s.kind === "PROFISSIONAL" ? "Profissional independente" : "Loja"}</span><h1 class="page-title">${esc(s.name)} ${verified(s)}</h1><p class="dim" style="max-width:680px">${esc(s.bio)}</p><div class="row">${s.verified ? `<span class="pill pill--ok">Vendedor verificado</span>` : ""}${s.cred ? `<span class="pill">${esc(s.cred)}</span>` : ""}<span class="pill">${esc(s.city)}</span></div></div></div><div class="head"><h2>${ls.length} ${ls.length === 1 ? "oferta" : "ofertas"}</h2></div>${grid(ls)}</div>`;
};

const cartItems = () => S.cart.map(c => ({ l: S.listings.find(x => x.id === c.id), q: c.q })).filter(x => x.l && live(x.l)).map(x => ({ ...x, sub: x.q * x.l.price }));

V.carrinho = () => {
  const it = cartItems(), tot = it.reduce((s, i) => s + i.sub, 0);
  return `<div class="wrap section"><h1 class="page-title">Carrinho</h1>${flashBox()}${!it.length ? `<div class="empty" style="margin-top:24px"><h3>Seu carrinho está vazio</h3><a href="#explorar" data-type="" class="btn btn--primary">Explorar o marketplace</a></div>` :
  `<div class="cart" style="margin-top:24px"><div>${it.map(({ l, q, sub }) => `<div class="line"><a href="#produto-${l.slug}">${visual(l)}</a><div style="min-width:0"><a href="#produto-${l.slug}"><b>${esc(l.title)}</b></a><div class="muted" style="font-size:13px">${esc(storeOf(l).name)} · ${price(l)}</div><div class="row" style="margin-top:8px"><label class="sr" for="cq-${l.id}">Quantidade</label><input id="cq-${l.id}" class="input qty" type="number" min="1" max="${l.stock ?? 99}" value="${q}" data-cartq="${l.id}"><button type="button" class="btn btn--sm" data-cartrm="${l.id}">Remover</button></div></div><b class="num">${money(sub)}</b></div>`).join("")}</div>
  <aside class="card summary"><dl><dt>Itens</dt><dd>${it.reduce((s, i) => s + i.q, 0)}</dd><dt>Vendedores</dt><dd>${new Set(it.map(i => i.l.store)).size}</dd><dt>Frete</dt><dd>Combinado com o vendedor</dd><dt class="total">Total</dt><dd class="total">${money(tot)}</dd></dl><a href="#checkout" class="btn btn--primary btn--block">Finalizar compra</a></aside></div>`}</div>`;
};

V.checkout = () => {
  if (!me()) { flash = ["info", "Entre ou crie uma conta para finalizar a compra."]; return V.entrar("checkout"); }
  const it = cartItems(); if (!it.length) return V.carrinho();
  const tot = it.reduce((s, i) => s + i.sub, 0), ship = it.some(i => i.l.type === "PHYSICAL");
  return `<div class="wrap section"><h1 class="page-title">Finalizar compra</h1><div class="cart" style="margin-top:24px"><form class="form card" data-form="checkout">${flashBox()}
  ${ship ? `<h2 class="h-sm">Entrega</h2><label class="field"><span>Nome de quem recebe</span><input id="ck-name" name="name" value="${esc(me().name)}" required></label><label class="field"><span>Endereço completo</span><textarea id="ck-addr" name="addr" rows="3" placeholder="Rua, número, bairro, cidade, UF, CEP" required></textarea></label>` : ""}
  <h2 class="h-sm">Pagamento</h2><div class="choice"><label><input type="radio" name="m" value="Pix" checked><span>Pix</span></label><label><input type="radio" name="m" value="Cartão"><span>Cartão de crédito</span></label><label><input type="radio" name="m" value="Boleto"><span>Boleto</span></label></div>
  <button class="btn btn--primary btn--block" type="submit">Confirmar pedido · ${money(tot)}</button></form>
  <aside class="card summary"><dl>${it.map(i => `<dt>${i.q}× ${esc(i.l.title)}</dt><dd>${money(i.sub)}</dd>`).join("")}<dt class="total">Total</dt><dd class="total">${money(tot)}</dd></dl></aside></div></div>`;
};

V.pedido = code => {
  const o = S.orders.find(x => x.code === code && x.buyer === S.me); if (!o) return V.naoencontrado();
  return `<div class="wrap section" style="max-width:880px"><span class="eyebrow">Pedido ${o.code}</span><div class="row between"><h1 class="page-title">${o.status === "PENDING_PAYMENT" ? "Pedido recebido" : "Pedido " + ORDER_ST[o.status][0].toLowerCase()}</h1>${pill(ORDER_ST[o.status])}</div>${flashBox()}<p class="dim">Feito em ${o.date} · ${o.method}</p>
  ${o.status === "PENDING_PAYMENT" ? `<div class="card stack" style="margin:20px 0"><b>Aguardando pagamento de ${money(o.total)}</b><div><button type="button" class="btn btn--primary" data-pay="${o.code}">Confirmar pagamento (simulação)</button></div></div>` : ""}
  <div class="table-wrap" style="margin-top:20px"><table class="table"><thead><tr><th>Item</th><th>Vendedor</th><th>Entrega</th><th class="num">Qtd.</th><th class="num">Total</th></tr></thead><tbody>${o.items.map(i => `<tr><td>${esc(i.title)}</td><td>${esc(S.stores.find(s => s.id === i.store).name)}</td><td>${i.ful === "PENDING" ? "Preparando" : i.ful === "SHIPPED" ? "Enviado" + (i.track ? " · " + esc(i.track) : "") : "Entregue"}</td><td class="num">${i.q}</td><td class="num">${money(i.unit * i.q)}</td></tr>`).join("")}</tbody></table></div>
  <p style="text-align:right;font-size:20px;font-weight:600;margin-top:14px">Total ${money(o.total)}</p><p class="muted">Entrega: ${esc(o.ship)}</p>
  ${["PAID","SHIPPED"].includes(o.status) ? `<div class="card row between" style="margin-top:20px"><span class="dim">Recebeu?</span><button type="button" class="btn btn--ghost" data-received="${o.code}">Confirmar recebimento</button></div>` : ""}
  <p style="margin-top:24px"><a class="link" href="#conta">← Meus pedidos</a></p></div>`;
};

V.entrar = next => `<div class="wrap"><div class="auth card"><h1 class="page-title">Entrar</h1>${flashBox()}<p class="dim">Escolha uma conta de teste.</p>
  <div class="stack" style="gap:10px">${[["cliente","Cliente","compra produtos e pede orçamentos"],["sp","Secure Privacy","vendedor: painel, vendas e orçamentos"],["vt","Vértice Equipamentos","vendedor de equipamentos"],["admin","Administrador","aprova lojas e anúncios"]].map(([id, n, d]) => `<button type="button" class="acct" data-login="${id}" data-next="${next || ""}"><span class="avatar">${n[0]}</span><span><b>${n}</b><small>${d}</small></span>${icon("arrow", 16)}</button>`).join("")}</div>
  <p class="dim" style="margin-top:20px">Ainda não tem conta? <a class="link" href="#vender">Criar conta de vendedor</a> ou <a class="link" href="#cadastrar">conta de comprador</a>.</p></div></div>`;

V.cadastrar = () => `<div class="wrap"><div class="auth card"><h1 class="page-title">Criar conta</h1>${flashBox()}<form class="form" data-form="signup" data-next="inicio"><label class="field"><span>Nome</span><input id="su-n" name="n" required></label><label class="field"><span>E-mail</span><input id="su-e" name="e" type="email" required></label><label class="field"><span>Senha</span><input id="su-p" name="p" type="password" minlength="8" required><small>Mínimo de 8 caracteres.</small></label><button class="btn btn--primary btn--block" type="submit">Criar conta</button></form></div></div>`;

V.vender = () => {
  const u = me(); if (myStore()) return V.painel();
  return `<div class="wrap section"><div class="product"><div><span class="eyebrow">Para vendedores</span><h1 class="page-title">Cadastre sua loja.</h1><p class="dim" style="font-size:17px">Produtos, serviços, software ou horas técnicas.</p>
  <div class="steps"><div class="${!u ? "on" : ""}"><span class="mono">ETAPA 1</span><b>Conta</b><small>Nome, e-mail e senha</small></div><div class="${u ? "on" : ""}"><span class="mono">ETAPA 2</span><b>Dados da loja</b><small>CPF/CNPJ, cidade e credenciais</small></div><div><span class="mono">ETAPA 3</span><b>Anúncios</b><small>Produtos e serviços no painel</small></div></div></div>
  <div class="card">${!u ? `<form class="form" data-form="signup" data-next="vender"><h2 class="h-md">Etapa 1 · Criar sua conta</h2>${flashBox()}<label class="field"><span>Nome do responsável</span><input id="v-n" name="n" autocomplete="name" required></label><label class="field"><span>E-mail</span><input id="v-e" name="e" type="email" required></label><label class="field"><span>Senha</span><input id="v-p" name="p" type="password" minlength="8" required><small>Mínimo de 8 caracteres.</small></label><button class="btn btn--primary btn--block" type="submit">Continuar para dados da loja</button><p class="dim" style="margin:0;font-size:14px">Já tem conta? <a class="link" href="#entrar">Entrar</a></p></form>`
  : `<form class="form" data-form="store"><h2 class="h-md">Etapa 2 · Dados da loja</h2>${flashBox()}<div class="choice"><label><input type="radio" name="kind" value="EMPRESA" checked><span>Empresa (CNPJ)</span></label><label><input type="radio" name="kind" value="PROFISSIONAL"><span>Profissional (CPF ou MEI)</span></label></div>
    <label class="field"><span>Nome da loja ou nome profissional</span><input id="st-n" name="name" required></label><div class="form-row"><label class="field"><span>CPF ou CNPJ</span><input id="st-d" name="doc" inputmode="numeric" required></label><label class="field"><span>Cidade / UF</span><input id="st-c" name="city" required></label></div>
    <label class="field"><span>O que você faz</span><textarea id="st-b" name="bio" rows="4" required></textarea></label><label class="field"><span>Certificações e registros</span><input id="st-cr" name="cred" placeholder="OSCP, ISO 27001, autorização PF"><small>Segurança privada exige autorização da PF.</small></label>
    <label class="row" style="flex-wrap:nowrap;align-items:flex-start;font-size:14px"><input id="st-t" type="checkbox" name="terms" style="margin-top:4px"><span class="dim">Aceito as <a class="link" href="#politica">regras</a>.</span></label><button class="btn btn--primary btn--block" type="submit">Enviar para análise</button></form>`}</div></div></div>`;
};

const dash = (side, body) => `<div class="wrap dash"><nav class="side" aria-label="Painel">${side}</nav><div style="min-width:0">${body}</div></div>`;
const sellerSide = st => { const h = location.hash.slice(1); return `<h4>${esc(st.name)}</h4>${[["painel","Visão geral"],["painel-anuncios","Anúncios"],["novo-anuncio","Novo anúncio"],["painel-vendas","Vendas"],["painel-orcamentos","Orçamentos"]].map(([k, t]) => `<a href="#${k}" class="${h === k ? "on" : ""}">${t}</a>`).join("")}${st.status === "APPROVED" ? `<a href="#loja-${st.slug}">Ver minha loja ↗</a>` : ""}<div style="padding:12px">${pill(STORE_ST[st.status])}</div>`; };
const needSeller = () => { if (!me()) { flash = ["info", "Entre com uma conta de vendedor."]; return V.entrar(); } if (!myStore()) return V.vender(); return null; };
const myItems = st => S.orders.flatMap(o => o.items.filter(i => i.store === st.id).map(i => ({ ...i, o })));

V.painel = () => {
  const n = needSeller(); if (n) return n; const st = myStore();
  const paid = myItems(st).filter(i => i.o.status !== "PENDING_PAYMENT");
  return dash(sellerSide(st), `<span class="eyebrow">Painel do vendedor</span><h1 class="page-title">${esc(st.name)}</h1>${flashBox()}
  ${st.status === "PENDING" ? `<div class="alert alert--info row between"><span>Loja em análise. Já pode cadastrar anúncios.</span><a class="btn btn--primary btn--sm" href="#novo-anuncio">Cadastrar anúncio</a></div>` : ""}
  <div class="kpis" style="margin-top:20px"><div class="kpi"><span>A receber (líquido)</span><b>${money(paid.reduce((s, i) => s + i.net, 0))}</b></div><div class="kpi"><span>Itens vendidos</span><b>${paid.reduce((s, i) => s + i.q, 0)}</b></div><div class="kpi"><span>Para enviar</span><b>${paid.filter(i => i.ful === "PENDING").length}</b></div><div class="kpi"><span>Orçamentos abertos</span><b>${S.quotes.filter(q => q.store === st.id && !q.reply).length}</b></div></div>
  <div class="row" style="margin-bottom:28px"><a class="btn btn--primary" href="#novo-anuncio">Novo anúncio</a><a class="btn btn--ghost" href="#painel-anuncios">${S.listings.filter(l => l.store === st.id && l.status === "ACTIVE").length} anúncios publicados</a><span class="muted" style="font-size:13px">Comissão da plataforma: ${(st.rate * 100).toFixed(0)}%</span></div>
  <h2 class="h-sm">Vendas recentes</h2>${paid.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Pedido</th><th>Item</th><th>Data</th><th class="num">Líquido</th></tr></thead><tbody>${paid.slice(-6).reverse().map(i => `<tr><td class="mono">${i.o.code}</td><td>${i.q}× ${esc(i.title)}</td><td>${i.o.date}</td><td class="num">${money(i.net)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Nenhuma venda ainda.</p>`}`);
};

V["painel-anuncios"] = () => {
  const n = needSeller(); if (n) return n; const st = myStore(), ls = S.listings.filter(l => l.store === st.id);
  return dash(sellerSide(st), `<div class="row between"><h1 class="page-title">Anúncios</h1><a class="btn btn--primary" href="#novo-anuncio">Novo anúncio</a></div>${flashBox()}
  ${ls.length ? `<div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>Anúncio</th><th>Categoria</th><th>Preço</th><th class="num">Estoque</th><th>Status</th><th></th></tr></thead><tbody>${ls.map(l => `<tr><td><a class="link" href="#produto-${l.slug}">${esc(l.title)}</a>${l.reason ? `<br><small style="color:var(--threat)">${esc(l.reason)}</small>` : ""}</td><td>${esc(catOf(l).name)}</td><td>${price(l)}</td><td class="num">${l.stock ?? "—"}</td><td>${pill(LIST_ST[l.status])}</td><td><div class="row" style="flex-wrap:nowrap"><a class="btn btn--ghost btn--sm" href="#editar-${l.id}">Editar</a>${["ACTIVE","DRAFT"].includes(l.status) ? `<button type="button" class="btn btn--sm" data-toggle="${l.id}">${l.status === "ACTIVE" ? "Pausar" : "Reativar"}</button>` : ""}</div></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty" style="margin-top:16px"><h3>Nenhum anúncio ainda</h3><a class="btn btn--primary" href="#novo-anuncio">Criar o primeiro</a></div>`}`);
};

const listingForm = l => `<form class="form card" data-form="listing" data-id="${l ? l.id : ""}">${flashBox()}
  <label class="field"><span>Categoria</span><select id="lf-cat" name="cat" required><option value="" ${!l ? "selected" : ""} disabled>Escolha…</option>${TK.map(t => `<optgroup label="${TYPES[t].label}">${CATS.filter(c => c.type === t).map(c => `<option value="${c.id}" ${l?.cat === c.id ? "selected" : ""}>${c.name}</option>`).join("")}</optgroup>`).join("")}</select></label>
  <label class="field"><span>Título</span><input id="lf-t" name="title" maxlength="120" value="${esc(l?.title || "")}" required></label>
  <label class="field"><span>Resumo</span><input id="lf-s" name="summary" maxlength="200" value="${esc(l?.summary || "")}" required></label>
  <label class="field"><span>Descrição completa</span><textarea id="lf-d" name="desc" rows="5">${esc(l?.desc || "")}</textarea></label>
  <div class="form-row"><label class="field"><span>Preço (R$)</span><input id="lf-p" name="price" inputmode="decimal" placeholder="Ex.: 1.299,90" value="${l?.price ? (l.price / 100).toFixed(2).replace(".", ",") : ""}"></label>
  <label class="field"><span>Cobrança por</span><select id="lf-u" name="unit">${["un","hora","dia","projeto","mês","ano","licença","usuário"].map(u => `<option value="${u}" ${(l?.unit || "un") === u ? "selected" : ""}>${u === "un" ? "unidade" : u}</option>`).join("")}</select></label></div>
  <div class="form-row"><label class="field"><span>Estoque</span><input id="lf-st" name="stock" type="number" min="0" value="${l?.stock ?? ""}"><small>Só equipamento.</small></label><label class="row" style="align-self:center;font-size:14px"><input id="lf-q" type="checkbox" name="quote" ${l?.quote ? "checked" : ""}> Sob orçamento</label></div>
  <label class="field"><span>Especificações</span><textarea id="lf-sp" name="specs" rows="5" placeholder="Uma por linha, no formato Nome: Valor&#10;Resolução: 4K&#10;Garantia: 2 anos">${esc((l?.specs || []).map(([k, v]) => k + ": " + v).join("\n"))}</textarea></label>
  <p class="muted" style="margin:0;font-size:13px">Publicado após aprovação.</p>
  <button class="btn btn--primary" type="submit">${l ? "Salvar e enviar para análise" : "Enviar para análise"}</button></form>`;
V["novo-anuncio"] = () => { const n = needSeller(); if (n) return n; return dash(sellerSide(myStore()), `<h1 class="page-title">Novo anúncio</h1><div style="margin-top:16px">${listingForm(null)}</div>`); };
V.editar = id => { const n = needSeller(); if (n) return n; const l = S.listings.find(x => x.id === id && x.store === myStore().id); if (!l) return V.naoencontrado(); return dash(sellerSide(myStore()), `<h1 class="page-title">Editar anúncio</h1><div style="margin-top:16px">${listingForm(l)}</div>`); };

V["painel-vendas"] = () => {
  const n = needSeller(); if (n) return n; const st = myStore(), it = myItems(st).reverse();
  return dash(sellerSide(st), `<h1 class="page-title">Vendas</h1>${it.length ? `<div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>Pedido</th><th>Item</th><th>Status</th><th class="num">Bruto</th><th class="num">Comissão</th><th class="num">Líquido</th><th>Envio</th></tr></thead><tbody>${it.map(i => { const phys = S.listings.find(l => l.id === i.listing)?.type === "PHYSICAL"; return `<tr><td><span class="mono">${i.o.code}</span><br><small class="muted">${i.o.date}</small></td><td>${i.q}× ${esc(i.title)}</td><td>${pill(ORDER_ST[i.o.status])}</td><td class="num">${money(i.unit * i.q)}</td><td class="num muted">−${money(i.fee)}</td><td class="num"><b>${money(i.net)}</b></td><td>${i.o.status === "PAID" && i.ful === "PENDING" ? `<div class="row" style="flex-wrap:nowrap">${phys ? `<input class="input" id="tr-${i.id}" placeholder="Rastreio" style="width:120px;padding:6px 10px" aria-label="Código de rastreio">` : ""}<button type="button" class="btn btn--ghost btn--sm" data-ship="${i.id}" data-order="${i.o.code}">${phys ? "Enviar" : "Entregue"}</button></div>` : `<small class="muted">${i.o.status === "PENDING_PAYMENT" ? "Aguardando pagamento" : i.ful === "SHIPPED" ? "Enviado " + esc(i.track || "") : "Entregue"}</small>`}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="muted" style="margin-top:16px">Nenhuma venda ainda.</p>`}`);
};

V["painel-orcamentos"] = () => {
  const n = needSeller(); if (n) return n; const st = myStore(), qs = S.quotes.filter(q => q.store === st.id).reverse();
  return dash(sellerSide(st), `<h1 class="page-title">Pedidos de orçamento</h1>${flashBox()}${qs.length ? `<div class="stack" style="margin-top:16px">${qs.map(q => `<div class="card stack" style="gap:10px"><div class="row between"><b>${esc(q.title)}</b>${pill(q.reply ? ["Respondido","ok"] : ["Aberto","warn"])}</div><small class="muted">${esc(q.buyerName)}${q.co ? " · " + esc(q.co) : ""} · ${q.date}</small><p class="dim" style="margin:0;white-space:pre-line">${esc(q.msg)}</p>${q.reply ? `<p class="alert alert--info" style="margin:0"><b>Sua resposta:</b> ${esc(q.reply)}</p>` : `<form class="form" data-form="reply" data-id="${q.id}"><label class="field"><span>Resposta / proposta</span><textarea id="rp-${q.id}" name="r" rows="3" required></textarea></label><button class="btn btn--primary btn--sm" type="submit" style="align-self:flex-start">Enviar resposta</button></form>`}</div>`).join("")}</div>` : `<p class="muted" style="margin-top:16px">Nenhum orçamento ainda.</p>`}`);
};

V.conta = () => {
  const u = me(); if (!u) return V.entrar();
  const os = S.orders.filter(o => o.buyer === u.id).reverse(), qs = S.quotes.filter(q => q.buyer === u.id).reverse();
  return `<div class="wrap section"><span class="eyebrow">Minha conta</span><h1 class="page-title">Olá, ${esc(u.name.split(" ")[0])}</h1><p class="dim">${esc(u.email)}</p>${flashBox()}
  <h2 class="h-md" style="margin:36px 0 14px">Pedidos</h2>${os.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Pedido</th><th>Data</th><th>Itens</th><th>Status</th><th class="num">Total</th></tr></thead><tbody>${os.map(o => `<tr><td><a class="link mono" href="#pedido-${o.code}">${o.code}</a></td><td>${o.date}</td><td>${o.items.length}</td><td>${pill(ORDER_ST[o.status])}</td><td class="num">${money(o.total)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><p>Você ainda não fez pedidos.</p><a class="btn btn--ghost" href="#explorar" data-type="">Explorar</a></div>`}
  <h2 class="h-md" style="margin:36px 0 14px">Orçamentos</h2>${qs.length ? `<div class="stack">${qs.map(q => `<div class="card stack" style="gap:8px"><div class="row between"><b>${esc(q.title)}</b>${pill(q.reply ? ["Respondido","ok"] : ["Aguardando resposta","warn"])}</div><small class="muted">${esc(S.stores.find(s => s.id === q.store).name)} · ${q.date}</small><p class="dim" style="margin:0">${esc(q.msg)}</p>${q.reply ? `<p class="alert alert--info" style="margin:0"><b>Resposta:</b> ${esc(q.reply)}</p>` : ""}</div>`).join("")}</div>` : `<p class="muted">Nenhum orçamento solicitado.</p>`}</div>`;
};

const adminSide = () => { const h = location.hash.slice(1); return `<h4>Administração</h4>${[["admin","Visão geral"],["admin-lojas","Vendedores"],["admin-curadoria","Curadoria de anúncios"]].map(([k, t]) => `<a href="#${k}" class="${h === k ? "on" : ""}">${t}</a>`).join("")}`; };
const needAdmin = () => me()?.role === "ADMIN" ? null : (flash = ["info", "Entre como Administrador para acessar esta área."], V.entrar());
V.admin = () => {
  const n = needAdmin(); if (n) return n;
  const paid = S.orders.filter(o => o.status !== "PENDING_PAYMENT");
  return dash(adminSide(), `<span class="eyebrow">Administração</span><h1 class="page-title">Visão geral</h1><div class="kpis" style="margin-top:20px"><div class="kpi"><span>Vendas pagas (GMV)</span><b>${money(paid.reduce((s, o) => s + o.total, 0))}</b></div><div class="kpi"><span>Receita de comissões</span><b>${money(paid.reduce((s, o) => s + o.fee, 0))}</b></div><div class="kpi"><span>Pedidos pagos</span><b>${paid.length}</b></div><div class="kpi"><span>Lojas aprovadas</span><b>${S.stores.filter(s => s.status === "APPROVED").length}</b></div></div>
  <div class="types" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><a class="type" href="#admin-lojas"><h3>${S.stores.filter(s => s.status === "PENDING").length} vendedores aguardando</h3><p>Conferir documento e credenciais</p></a><a class="type" href="#admin-curadoria"><h3>${S.listings.filter(l => l.status === "PENDING").length} anúncios na fila</h3><p>Curadoria antes da publicação</p></a></div>`);
};
V["admin-lojas"] = () => {
  const n = needAdmin(); if (n) return n;
  return dash(adminSide(), `<h1 class="page-title">Vendedores</h1><p class="dim">Segurança privada exige autorização da PF.</p><div class="stack" style="margin-top:16px">${[...S.stores].sort((a, b) => (a.status === "PENDING" ? -1 : 0) - (b.status === "PENDING" ? -1 : 0)).map(s => `<div class="card stack" style="gap:10px"><div class="row between"><div><b>${esc(s.name)}</b> <span class="muted">· ${s.kind === "PROFISSIONAL" ? "Profissional" : "Empresa"} · ${esc(s.city)}</span></div><div class="row">${pill(STORE_ST[s.status])}${s.verified ? `<span class="pill pill--ok">Verificado</span>` : ""}</div></div><small class="muted mono">${esc(s.doc)} · ${S.listings.filter(l => l.store === s.id).length} anúncios · comissão ${(s.rate * 100).toFixed(0)}%</small><p class="dim" style="margin:0">${esc(s.bio)}</p>${s.cred ? `<small>Credenciais: <span class="dim">${esc(s.cred)}</span></small>` : ""}
  <div class="row">${s.status !== "APPROVED" ? `<button type="button" class="btn btn--sm btn--ghost" data-store="${s.id}" data-do="approve">Aprovar</button>` : `<button type="button" class="btn btn--sm btn--danger" data-store="${s.id}" data-do="suspend">Suspender</button>`}${s.status === "PENDING" ? `<button type="button" class="btn btn--sm btn--danger" data-store="${s.id}" data-do="reject">Recusar</button>` : ""}<button type="button" class="btn btn--sm btn--ghost" data-store="${s.id}" data-do="verify">${s.verified ? "Remover selo" : "Dar selo de verificado"}</button></div></div>`).join("")}</div>`);
};
V["admin-curadoria"] = () => {
  const n = needAdmin(); if (n) return n;
  const pend = S.listings.filter(l => l.status === "PENDING"), act = S.listings.filter(l => l.status === "ACTIVE");
  return dash(adminSide(), `<h1 class="page-title">Curadoria de anúncios</h1>
  <h2 class="h-sm" style="margin-top:24px">Na fila (${pend.length})</h2>${pend.length ? `<div class="stack">${pend.map(l => `<div class="card stack" style="gap:8px"><div class="row between"><a class="link" href="#produto-${l.slug}"><b>${esc(l.title)}</b></a><span class="muted">${esc(storeOf(l).name)} · ${esc(catOf(l).name)} · ${price(l)}</span></div><p class="dim" style="margin:0">${esc(l.summary)}</p>${l.specs.length ? `<small class="muted">${esc(l.specs.map(([k, v]) => k + ": " + v).join(" · "))}</small>` : ""}<div class="row"><button type="button" class="btn btn--primary btn--sm" data-listing="${l.id}" data-do="approve">Aprovar</button><input class="input" id="rs-${l.id}" placeholder="Motivo da recusa" aria-label="Motivo da recusa" style="flex:1;min-width:160px;padding:6px 10px"><button type="button" class="btn btn--danger btn--sm" data-listing="${l.id}" data-do="reject">Recusar</button></div></div>`).join("")}</div>` : `<p class="muted">Nenhum anúncio aguardando.</p>`}
  <h2 class="h-sm" style="margin-top:36px">Publicados (${act.length})</h2><div class="table-wrap"><table class="table"><thead><tr><th>Anúncio</th><th>Vendedor</th><th>Destaque</th><th></th></tr></thead><tbody>${act.map(l => `<tr><td><a class="link" href="#produto-${l.slug}">${esc(l.title)}</a></td><td>${esc(storeOf(l).name)}</td><td>${l.featured ? "★" : "—"}</td><td><div class="row" style="flex-wrap:nowrap"><button type="button" class="btn btn--ghost btn--sm" data-listing="${l.id}" data-do="feature">${l.featured ? "Tirar destaque" : "Destacar"}</button><button type="button" class="btn btn--danger btn--sm" data-listing="${l.id}" data-do="reject">Remover</button></div></td></tr>`).join("")}</tbody></table></div>`);
};

V.politica = () => `<div class="wrap section" style="max-width:860px"><span class="eyebrow">Confiança</span><h1 class="page-title">Curadoria e itens proibidos</h1>
  <h2 class="h-md" style="margin:36px 0 12px">Regras para vendedores</h2><ul class="dim plist">${["Todo vendedor passa por verificação de identidade (CPF ou CNPJ) antes de publicar.","Todo anúncio passa por curadoria antes de ficar público. Alterações voltam para análise.","Serviços de segurança privada (vigilância, escolta, segurança pessoal) exigem autorização da Polícia Federal.","Serviços ofensivos (pentest, Red Team, engenharia social) só podem ser executados com autorização formal e escopo assinado pelo contratante.","Vendedores emitem nota fiscal e respondem pela garantia dos produtos."].map(x => `<li>${x}</li>`).join("")}</ul>
  <h2 class="h-md" style="margin:36px 0 12px">Itens e serviços proibidos</h2><ul class="dim plist">${["Bloqueadores de sinal (jammers): venda e uso proibidos pela Anatel.","Equipamentos para interceptar comunicações ou capturar mensagens de terceiros.","Spyware, stalkerware ou software para monitorar pessoas sem consentimento.","Escutas e câmeras disfarçadas oferecidas para gravar pessoas sem que saibam.","Armas de fogo, munições, armas de choque e itens controlados pelo Exército.","Malware, exploits à venda, credenciais vazadas, bases de dados pessoais ou invasão sem autorização do alvo.","Produtos sem homologação da Anatel quando ela for obrigatória."].map(x => `<li>${x}</li>`).join("")}</ul></div>`;

V.naoencontrado = () => `<div class="wrap section"><div class="empty"><h3>Página não encontrada</h3><p>O endereço pode ter mudado ou o anúncio não está mais disponível.</p><a class="btn btn--primary" href="#explorar" data-type="">Explorar o marketplace</a></div></div>`;

/* ---------------- Roteamento ---------------- */
const app = document.getElementById("app");
function render() {
  const h = location.hash.slice(1) || "inicio";
  let body;
  const pref = [["produto-", V.produto], ["loja-", V.loja], ["pedido-", V.pedido], ["editar-", V.editar]].find(([p]) => h.startsWith(p));
  if (pref) body = pref[1](h.slice(pref[0].length));
  else body = (V[h] || V.naoencontrado)();
  app.innerHTML = `<div class="demo">Demonstração · pagamento simulado</div>${header()}<main>${body}</main>${footer()}`;
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

/* ---------------- Ações ---------------- */
function addOrder(items, method, ship) {
  const code = "SP" + Date.now().toString(36).toUpperCase().slice(-6);
  const rows = items.map(({ l, q }) => { const s = storeOf(l), gross = q * l.price, fee = Math.round(gross * s.rate); return { id: uid(), listing: l.id, store: s.id, title: l.title, q, unit: l.price, fee, net: gross - fee, ful: "PENDING" }; });
  items.forEach(({ l, q }) => { if (l.type === "PHYSICAL") l.stock = Math.max(0, (l.stock || 0) - q); });
  S.orders.push({ code, buyer: S.me, items: rows, total: rows.reduce((s, r) => s + r.unit * r.q, 0), fee: rows.reduce((s, r) => s + r.fee, 0), method, ship, status: "PENDING_PAYMENT", date: today() });
  return code;
}

app.addEventListener("click", e => {
  const t = e.target.closest("[data-type],[data-cat],[data-search],[data-level],[data-ftype],[data-fcat],[data-sort],[data-act],[data-login],[data-cartrm],[data-pay],[data-received],[data-toggle],[data-ship],[data-store],[data-listing]");
  if (!t) return;
  const d = t.dataset;
  if (d.level) { layerLevel = d.level; render(); return; }
  if ("type" in d && t.matches("a")) { filt = { ...filt, type: d.type, cat: "" }; if (t.getAttribute("href") === "#explorar" && location.hash === "#explorar") { e.preventDefault(); render(); } return; }
  if (d.cat && t.matches("a")) { const c = CATS.find(x => x.id === d.cat); filt = { ...filt, type: c.type, cat: d.cat }; if (location.hash === "#explorar") { e.preventDefault(); render(); } return; }
  if (d.search) { filt = { q: d.search, type: "", cat: "", sort: "recentes" }; if (location.hash === "#explorar") { e.preventDefault(); render(); } return; }
  if ("ftype" in d) { filt = { ...filt, type: d.ftype, cat: "" }; return render(); }
  if (d.fcat) { filt = { ...filt, cat: filt.cat === d.fcat ? "" : d.fcat }; return render(); }
  if (d.sort) { filt.sort = d.sort; return render(); }
  if (d.login) { S.me = d.login; save(); const u = me(); return go(d.next || (myStore() ? "painel" : u.role === "ADMIN" ? "admin" : "inicio"), ["ok", `Você entrou como ${u.name}.`]); }
  if (d.act === "logout") { S.me = null; save(); return go("inicio"); }
  if (d.act === "reset") { const keep = null; S = seed(); S.me = keep; save(); filt = { q: "", type: "", cat: "", sort: "recentes" }; return go("inicio"); }
  if (d.act === "clear-q") { filt.q = ""; return render(); }
  if (d.act === "clear-all") { filt = { q: "", type: "", cat: "", sort: "recentes" }; return render(); }
  if (d.cartrm) { S.cart = S.cart.filter(c => c.id !== d.cartrm); save(); return render(); }
  if (d.pay) { const o = S.orders.find(x => x.code === d.pay); o.status = "PAID"; save(); flash = ["ok", "Pagamento confirmado."]; return render(); }
  if (d.received) { const o = S.orders.find(x => x.code === d.received); o.status = "COMPLETED"; o.items.forEach(i => i.ful = "DELIVERED"); save(); flash = ["ok", "Recebimento confirmado. Você já pode avaliar."]; return render(); }
  if (d.toggle) { const l = S.listings.find(x => x.id === d.toggle); l.status = l.status === "ACTIVE" ? "DRAFT" : "PENDING"; save(); flash = ["ok", l.status === "DRAFT" ? "Anúncio pausado." : "Anúncio reenviado para a curadoria."]; return render(); }
  if (d.ship) { const o = S.orders.find(x => x.code === d.order), i = o.items.find(x => x.id === d.ship), tr = document.getElementById("tr-" + d.ship); i.ful = "SHIPPED"; i.track = tr ? tr.value.trim() : ""; if (o.items.every(x => x.ful !== "PENDING")) o.status = "SHIPPED"; save(); return render(); }
  if (d.store) { const s = S.stores.find(x => x.id === d.store); if (d.do === "approve") { s.status = "APPROVED"; } if (d.do === "reject") s.status = "REJECTED"; if (d.do === "suspend") s.status = "SUSPENDED"; if (d.do === "verify") s.verified = !s.verified; save(); return render(); }
  if (d.listing) { const l = S.listings.find(x => x.id === d.listing); if (d.do === "approve") { l.status = "ACTIVE"; l.reason = ""; } if (d.do === "reject") { const r = document.getElementById("rs-" + l.id); l.status = "REJECTED"; l.reason = (r && r.value.trim()) || "Não atende às regras de curadoria."; } if (d.do === "feature") l.featured = !l.featured; save(); return render(); }
});

app.addEventListener("change", e => {
  const id = e.target.dataset?.cartq; if (!id) return;
  const q = Math.max(1, Math.min(99, parseInt(e.target.value) || 1)); const c = S.cart.find(x => x.id === id); if (c) c.q = q; save(); render();
});

app.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f)), k = f.dataset.form, err = m => { flash = ["bad", m]; render(); };
  if (k === "search") { filt = { q: (v.q || "").trim(), type: "", cat: "", sort: "recentes" }; return go("explorar"); }
  if (k === "add") { const l = S.listings.find(x => x.id === f.dataset.id), q = Math.max(1, parseInt(v.q) || 1), c = S.cart.find(x => x.id === l.id); if (c) c.q = Math.min(99, c.q + q); else S.cart.push({ id: l.id, q }); save(); return go("carrinho", ["ok", "Item adicionado ao carrinho."]); }
  if (k === "checkout") { const it = cartItems(), ship = it.some(i => i.l.type === "PHYSICAL"); if (ship && (v.addr || "").trim().length < 10) return err("Informe o endereço completo para entrega."); const code = addOrder(it, v.m, ship ? `${v.name} · ${v.addr}` : "Entrega digital / serviço"); S.cart = []; save(); return go("pedido-" + code); }
  if (k === "quote") { const l = S.listings.find(x => x.id === f.dataset.id); if ((v.msg || "").trim().length < 15) return err("Descreva sua necessidade em pelo menos 15 caracteres."); S.quotes.push({ id: uid(), listing: l.id, title: l.title, store: l.store, buyer: S.me, buyerName: me().name, co: v.co, msg: v.msg.trim(), date: today() }); save(); return go("conta", ["ok", "Orçamento enviado."]); }
  if (k === "reply") { const q = S.quotes.find(x => x.id === f.dataset.id); q.reply = v.r.trim(); save(); flash = ["ok", "Resposta enviada ao cliente."]; return render(); }
  if (k === "review") { const l = S.listings.find(x => x.id === f.dataset.id); if ((v.c || "").trim().length < 5) return err("Escreva um comentário."); l.reviews.unshift({ uid: S.me, name: me().name, r: +v.r, c: v.c.trim() }); save(); flash = ["ok", "Avaliação publicada."]; return render(); }
  if (k === "signup") { if ((v.n || "").trim().length < 2) return err("Informe seu nome."); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.e || "")) return err("E-mail inválido."); if ((v.p || "").length < 8) return err("A senha precisa ter pelo menos 8 caracteres."); const id = "u" + uid(); S.users.push({ id, name: v.n.trim(), email: v.e.trim(), role: "BUYER" }); S.me = id; save(); return go(f.dataset.next, ["ok", "Conta criada."]); }
  if (k === "store") { const dg = (v.doc || "").replace(/\D/g, ""); if ((v.name || "").trim().length < 2) return err("Informe o nome da loja."); if (!(dg.length === 11 || dg.length === 14)) return err("Informe um CPF (11 dígitos) ou CNPJ (14 dígitos)."); if (!(v.city || "").trim()) return err("Informe cidade e UF."); if ((v.bio || "").trim().length < 30) return err("Descreva sua atuação em pelo menos 30 caracteres."); if (!v.terms) return err("É preciso aceitar as regras de curadoria."); let slug = slugify(v.name) || "loja"; if (S.stores.some(s => s.slug === slug)) slug += "-" + uid().slice(0, 3); S.stores.push({ id: "s" + uid(), slug, name: v.name.trim(), kind: v.kind, city: v.city.trim(), bio: v.bio.trim(), cred: (v.cred || "").trim(), verified: false, rate: 0.12, status: "PENDING", owner: S.me, doc: v.doc.trim() }); save(); return go("painel"); }
  if (k === "listing") {
    const st = myStore(), id = f.dataset.id, c = CATS.find(x => x.id === v.cat); if (!c) return err("Escolha uma categoria.");
    if ((v.title || "").trim().length < 5) return err("O título precisa ter pelo menos 5 caracteres."); if ((v.summary || "").trim().length < 15) return err("O resumo precisa ter pelo menos 15 caracteres.");
    const raw = (v.price || "").replace(/\./g, "").replace(",", "."), pr = raw ? Math.round(parseFloat(raw) * 100) : null, quote = !!v.quote;
    if (pr !== null && (!isFinite(pr) || pr < 100)) return err("Preço inválido."); if (!quote && pr === null) return err("Informe um preço ou marque “sob orçamento”.");
    const specs = (v.specs || "").split("\n").map(x => x.split(":")).filter(p => p.length >= 2 && p[0].trim()).slice(0, 20).map(p => [p[0].trim(), p.slice(1).join(":").trim()]);
    const data = { cat: c.id, type: c.type, title: v.title.trim(), summary: v.summary.trim(), desc: (v.desc || "").trim() || v.summary.trim(), price: pr, unit: v.unit, quote, stock: c.type === "PHYSICAL" ? Math.max(0, parseInt(v.stock) || 0) : null, specs, status: "PENDING", reason: "" };
    if (id) Object.assign(S.listings.find(x => x.id === id), data);
    else { let slug = slugify(data.title); if (S.listings.some(x => x.slug === slug)) slug += "-" + uid().slice(0, 3); S.listings.push({ id: uid(), slug, store: st.id, featured: false, reviews: [], ...data }); }
    save(); return go("painel-anuncios", ["ok", "Enviado para aprovação."]);
  }
});

render();
})();

</script>
